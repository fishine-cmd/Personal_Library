{% extends "base.html" %}
{% block title %}设置{% endblock %}
{% block content %}
<h4 class="mb-4">设置</h4>

<div class="row g-3">
  <div class="col-md-7">
    <div class="card mb-3">
      <div class="card-header">PDF 解析服务（MinerU）</div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="form_name" value="mineru">
          <div class="mb-3">
            <label class="form-label">服务地址</label>
            <input type="text" class="form-control" name="mineru_url" id="mineru_url"
                   value="{{ settings.mineru_url or default_url }}"
                   placeholder="{{ default_url }}">
            <div class="form-text">默认 <code>{{ default_url }}</code></div>
          </div>
          <div id="test-result" class="mb-3"></div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" type="button" id="btn-test">测试连接</button>
            <button class="btn btn-primary" type="submit">保存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-5">
    <div class="card mb-3">
      <div class="card-header">屏幕 AI Agent</div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="form_name" value="ai_agent">
          <div class="mb-3">
            <label class="form-label">昵称</label>
            <input type="text" class="form-control" name="agent_name" value="{{ agent.agent_name or '小咪' }}" maxlength="64">
          </div>
          <div class="mb-3">
            <label class="form-label">接入 URL（OpenAI 兼容 chat completions）</label>
            <input type="url" class="form-control" name="ai_api_url" value="{{ agent.api_url or '' }}" placeholder="https://api.deepseek.com/v1/chat/completions">
            <div class="form-text">需指向 <code>/v1/chat/completions</code> 类的接口，如 DeepSeek / Moonshot / OpenAI / 自建 vLLM。</div>
          </div>
          <div class="mb-3">
            <label class="form-label">模型名称</label>
            <input type="text" class="form-control" name="ai_model" value="{{ agent.model or '' }}" maxlength="64" placeholder="deepseek-chat">
            <div class="form-text">例如 <code>deepseek-chat</code>、<code>moonshot-v1-8k</code>、<code>gpt-4o-mini</code>。</div>
          </div>
          <div class="mb-3">
            <label class="form-label">API Key</label>
            <input type="password" class="form-control" name="ai_api_key" value="" placeholder="{% if agent.api_key %}已配置{% else %}留空表示不修改{% endif %}">
            <div class="form-text">保存后不会回显明文。留空表示沿用原值。</div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="agent_enabled" name="agent_enabled" {% if agent.enabled %}checked{% endif %}>
            <label class="form-check-label" for="agent_enabled">启用猫娘</label>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="clear_ai_api_key" name="clear_ai_api_key">
            <label class="form-check-label" for="clear_ai_api_key">清空 API Key</label>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">保存 AI Agent 设置</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('btn-test').addEventListener('click', async () => {
  const url = document.getElementById('mineru_url').value.trim();
  const out = document.getElementById('test-result');
  out.innerHTML = '<div class="alert alert-info py-2 mb-0">正在测试...</div>';
  const fd = new FormData();
  fd.append('mineru_url', url);
  try {
    const r = await fetch('{{ url_for("settings.test_mineru") }}', { method: 'POST', body: fd });
    const j = await r.json();
    if (j.ok) {
      out.innerHTML = `<div class="alert alert-success py-2 mb-0">连接成功 · 版本 ${j.version || '?'} · 状态 ${j.status}</div>`;
    } else {
      out.innerHTML = `<div class="alert alert-danger py-2 mb-0">连接失败: ${j.error}</div>`;
    }
  } catch (e) {
    out.innerHTML = `<div class="alert alert-danger py-2 mb-0">请求失败: ${e}</div>`;
  }
});
</script>
{% endblock %}
